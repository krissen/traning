[project]
name = "traning-cli"
version = "0.3.0"
description = "Unified CLI for tRäning — running data analysis"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "garminconnect>=0.3.1",
    # Pinned to the commit installed/verified in dev venv (2026-07-07);
    # jeffton/pirate-garmin has no tagged releases, so we pin a commit SHA
    # on main rather than an unpinned branch ref.
    "pirate-garmin @ git+https://github.com/jeffton/pirate-garmin.git@6946f11340ac0c8e45e14321ff0e4856d4733dd1",
    "requests>=2.28.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fitparse>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.5",
    "mypy>=1.10",
]

[project.scripts]
traning = "traning_cli.main:cli"
vayu = "traning_cli.mcp.server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]
# RUF001-003 flags typographic characters (' - x) as intentional Swedish text.
# RUF100 removes noqa directives pointing at rules we've opted out of —
# mechanically correct, but it erases the documentation of why the exception
# exists.
ignore = ["RUF001", "RUF002", "RUF003", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are requested for their side effect and never used in the body.
"python/tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
