name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set PREK_HOME
        # Outside the working tree so the gitleaks full-tree sweep below
        # doesn't see the hook environments, and so a future default-path
        # change in prek isn't a silent cache miss. The `runner` context
        # isn't available in a job-level `env:` block (actionlint), hence
        # $GITHUB_ENV instead.
        run: echo "PREK_HOME=${{ runner.temp }}/prek" >> "$GITHUB_ENV"

      - name: Cache prek hook environments
        uses: actions/cache@v4
        with:
          path: ${{ env.PREK_HOME }}
          key: prek-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: prek
        # R lint (lintr/styler/parsable-R) is `language: system` against
        # the local Rscript/styler/lintr install (see
        # .pre-commit-config.yaml — the renv-based mirror does not
        # build). This runner has no R toolchain, so those three are
        # skipped here; R changes are linted locally, at commit time.
        # `prek run --all-files` is green (0 lintr findings, see the
        # ORDER 1 report) — R/lintr debt was paid down as part of
        # introducing this config, rather than deferred to diff mode.
        env:
          SKIP: parsable-R,style-files,lintr
        run: pipx run --spec prek==0.5.2 prek run --all-files --show-diff-on-failure

      - name: Gitleaks full-tree scan
        # The prek gitleaks hook runs `gitleaks git --staged`, which only
        # sees the pending diff — a no-op on a clean checkout with nothing
        # staged. This step downloads the same pinned version and sweeps
        # the whole tree instead. Checksum verified against the release's
        # own checksums file before executing the binary.
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest -q python/tests

  # R tests (testthat) are NOT run in CI yet — see the PR description /
  # ORDER 1 report for the CRAN-dependency-count estimate this decision
  # is based on.
